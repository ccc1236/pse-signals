<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSE Signal Dashboard</title>
<style>
:root {
  --bg: #0b0e11; --p1: #12161c; --p2: #171c24; --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.16);
  --t: #e7e9ec; --t2: #98a1ad; --t3: #626c78; --up: #16c784; --down: #ea3943; --gold: #f0b90b; --violet: #a78bfa; --orange: #ff9f43;
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--t); font: 12px/1.4 var(--mono); }
#app { height: 100vh; display: grid; grid-template-rows: 40px minmax(0, 1fr) 24px; grid-template-columns: minmax(0, 1fr); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: var(--t2); background: none; border: 1px solid var(--line2); padding: 4px 10px; cursor: pointer; border-radius: 2px; }
button:hover { color: var(--t); border-color: var(--gold); }
button:disabled { opacity: .5; cursor: wait; }
.pos { color: var(--up); } .neg { color: var(--down); } .dim { color: var(--t3); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--p1); }
.brand { font-weight: 700; letter-spacing: .08em; } .brand b { color: var(--gold); }
.dyn { font-size: 9px; color: var(--gold); border: 1px solid rgba(240,185,11,.4); padding: 0 4px; margin-left: 6px; }
.mid { color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl { display: flex; gap: 6px; align-items: center; }
.tf { display: inline-flex; } .tf button { border-radius: 0; } .tf button.on, .rail-tabs button.on { background: var(--gold); color: #0b0e11; border-color: var(--gold); }

.term { display: grid; grid-template-columns: 290px minmax(0, 1fr) 270px; gap: 1px; background: var(--line); min-height: 0; }
.term > * { background: var(--bg); min-height: 0; overflow: auto; }
.rail { display: flex; flex-direction: column; overflow: hidden; }
.rail-tabs { display: flex; } .rail-tabs button { flex: 1; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px; }
.rail-h, .rr { display: grid; grid-template-columns: 1.2fr 1fr 1fr .7fr; gap: 6px; padding: 6px 12px; align-items: center; }
.rail-h { color: var(--t3); font-size: 10px; letter-spacing: .06em; border-bottom: 1px solid var(--line); } .rail-h span { cursor: pointer; } .rail-h span:hover { color: var(--t); }
.rail-list { overflow: auto; flex: 1; }
.rr { cursor: pointer; border-left: 2px solid transparent; } .rr:hover { background: var(--p1); } .rr.sel { background: var(--p2); border-left-color: var(--gold); }
.rr .s { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.sd { width: 6px; height: 6px; border-radius: 50%; display: inline-block; } .sd.buy { background: var(--up); } .sd.sell { background: var(--down); } .sd.warn { background: var(--gold); }

.center { padding: 0 0 20px; }
.dhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dsym { font: 700 24px var(--mono); } .dsym small { font-size: 13px; color: var(--t3); }
.star { font-size: 9px; letter-spacing: .08em; color: var(--gold); border: 1px solid rgba(240,185,11,.4); padding: 1px 5px; margin-left: 10px; vertical-align: middle; }
.dname { color: var(--t2); margin-top: 2px; }
.dpx { text-align: right; } .px { font: 700 30px var(--mono); } .px small { font-size: 12px; color: var(--t3); }
.cells { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); border-bottom: 1px solid var(--line); }
.cells > div { padding: 10px 20px; border-right: 1px solid var(--line); } .cells > div:last-child { border-right: 0; }
.cells label { display: block; font-size: 10px; color: var(--t3); letter-spacing: .08em; } .cells b { font-size: 16px; }
.blk { padding: 16px 20px 0; } .blk-t { font-size: 10px; letter-spacing: .1em; color: var(--t2); margin-bottom: 10px; }
.gauge { position: relative; height: 8px; background: var(--p2); margin: 6px 0 22px; }
.gauge .z { position: absolute; top: 0; bottom: 0; } .z.os { background: rgba(167,139,250,.22); } .z.entry { background: rgba(22,199,132,.3); } .z.ob { background: rgba(234,57,67,.22); }
.pin { position: absolute; top: -4px; width: 3px; height: 16px; margin-left: -1px; }
.tick { position: absolute; top: 12px; font-size: 9px; color: var(--t3); transform: translateX(-50%); }
.gauge-note { font-size: 10px; color: var(--t3); margin: -14px 0 0; }
.chart { width: 100%; height: 130px; background: var(--p1); border: 1px solid var(--line); margin-bottom: 10px; display: block; }
table { width: 100%; border-collapse: collapse; } th { text-align: left; font-size: 10px; color: var(--t3); letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); font-weight: 400; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); } tbody tr:hover td { background: var(--p1); }

.feed { padding: 0 0 16px; } .feed-t { font-size: 10px; letter-spacing: .1em; color: var(--t2); padding: 12px 14px 8px; border-bottom: 1px solid var(--line); background: var(--p1); position: sticky; top: 0; }
.fr { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; } .fr:hover { background: var(--p1); }
.fr .why { grid-column: 1 / -1; color: var(--t3); font-size: 11px; }
.tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; border-radius: 2px; }
.tag.buy { background: rgba(22,199,132,.16); color: var(--up); } .tag.sell { background: rgba(234,57,67,.16); color: var(--down); }
.tag.warn { background: rgba(240,185,11,.16); color: var(--gold); } .tag.sold { background: rgba(167,139,250,.16); color: var(--violet); }
.empty { color: var(--t3); padding: 18px 14px; }
.status { display: flex; align-items: center; padding: 0 14px; color: var(--t3); font-size: 10px; border-top: 1px solid var(--line); background: var(--p1); white-space: nowrap; overflow: hidden; }

@media (max-width: 1000px) { #app { height: auto; } .term { grid-template-columns: 1fr; } .term > * { max-height: none; } .rail-list { max-height: 320px; } .mid { display: none; } }
</style></head>
<body><div id="app"><div style="padding:120px 0;text-align:center;opacity:.5">Loading</div></div>
<script>
// Data layer: fetching, escaping, selection state.
const API = '';  // same origin as the dashboard server
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Escape every server string once, at the boundary, before it can reach innerHTML.
const clean = v => typeof v === 'string' ? esc(v) : Array.isArray(v) ? v.map(clean)
  : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, clean(x)])) : v;

const S = { data: null, tf: '1d', sel: null, all: false, trades: {}, busy: false, sortKey: null, sortAsc: true };
const $app = document.getElementById('app');
const sign = n => (n > 0 ? '+' : '');
const cls = n => (n > 0 ? 'pos' : n < 0 ? 'neg' : 'dim');
const pct = (n, d = 2) => (n == null ? '-' : sign(n) + n.toFixed(d) + '%');

const SORTK = { symbol: s => s.symbol, price: s => s.close, chg: s => s.daily_change, rsi: s => s.rsi ?? -1 };
const cur = () => S.data.stocks.find(s => s.symbol === S.sel);
const curTrades = () => S.trades[S.tf + ':' + S.sel];
function rows() {
  let r = S.all ? S.data.stocks : S.data.stocks.filter(s => s.in_watchlist);
  if (S.sortKey) { const k = SORTK[S.sortKey]; r = [...r].sort((a, b) => k(a) < k(b) ? (S.sortAsc ? -1 : 1) : k(a) > k(b) ? (S.sortAsc ? 1 : -1) : 0); }
  return r;
}
function tradeStats(t) {
  const p = t.map(x => x.pnl_pct), wins = p.filter(x => x > 0).length, total = p.reduce((a, b) => a + b, 0);
  return { n: t.length, wins, wr: t.length ? wins / t.length * 100 : 0, total, avg: t.length ? total / t.length : 0,
    hold: t.length ? t.reduce((a, x) => a + x.hold_days, 0) / t.length : 0 };
}

async function load(path) { return clean(await (await fetch(API + path)).json()); }
function pickDefault() {
  const d = S.data;
  if (S.sel && d.stocks.some(s => s.symbol === S.sel)) return;
  const b = d.all_signals.find(x => x.signal === 'BUY');
  S.sel = (b ? b.symbol : (d.stocks.find(s => s.in_watchlist) || d.stocks[0])?.symbol) ?? null;
  const c = S.sel && cur();
  if (c && !c.in_watchlist) S.all = true;
}
async function loadTrades() {
  const k = S.tf + ':' + S.sel;
  if (!S.sel || S.trades[k]) return;
  try { S.trades[k] = await load(`/api/trades/${encodeURIComponent(S.sel)}?tf=${S.tf}`); } catch (e) { S.trades[k] = []; }
}
async function fetchData() {
  try { S.data = await load(`/api/data?tf=${S.tf}`); pickDefault(); render(); await loadTrades(); render(); }
  catch (e) { $app.innerHTML = '<div style="padding:120px 0;text-align:center;opacity:.6">Failed to load data. Is the server running?</div>'; }
}
async function fetchNew() {
  S.busy = true; render();
  try { S.data = await load(`/api/fetch?tf=${S.tf}`); S.trades = {}; pickDefault(); await loadTrades(); } catch (e) { console.error(e); }
  S.busy = false; render();
}
async function select(sym) { S.sel = sym; render(); await loadTrades(); render(); }
function setTF(tf) { S.tf = tf; S.sel = null; fetchData(); }
function setAll(v) { S.all = v; render(); }
function setSort(k) { if (S.sortKey === k) S.sortAsc = !S.sortAsc; else { S.sortKey = k; S.sortAsc = k === 'symbol'; } render(); }
const arrow = k => (S.sortKey === k ? (S.sortAsc ? ' &#9650;' : ' &#9660;') : '');
document.addEventListener('DOMContentLoaded', fetchData);

// Terminal layout: watchlist rail | selected stock detail | signal tape.
const REASON = { take_profit: 'TP', stop_loss: 'SL', rsi_overbought: 'RSI' };

function rsiColor(r) {
  return r == null ? 'var(--t3)' : r > 75 ? 'var(--down)' : r > 65 ? 'var(--orange)' : r >= 40 ? 'var(--up)' : r > 30 ? 'var(--gold)' : 'var(--violet)';
}
function gauge(r) {
  const p = Math.min(100, Math.max(0, r ?? 0));
  const tick = (v, t) => `<span class="tick" style="left:${v}%">${t}</span>`;
  return `<div class="gauge"><i class="z os" style="left:0;width:30%"></i><i class="z entry" style="left:40%;width:20%"></i><i class="z ob" style="left:75%;width:25%"></i>
    <b class="pin" style="left:${p}%;background:${rsiColor(r)}"></b>${tick(30, '30')}${tick(40, '40')}${tick(60, '60')}${tick(75, '75')}</div>
    <div class="gauge-note">entry band 40-60</div>`;
}
function pnlChart(t) {
  const W = 640, H = 130, mid = H / 2, n = t.length, step = (W - 20) / n, bw = Math.min(40, step - 6);
  const max = Math.max(...t.map(x => Math.abs(x.pnl_pct)), 1);
  const bars = t.map((x, i) => {
    const h = Math.max(Math.abs(x.pnl_pct) / max * (mid - 14), 1), y = x.pnl_pct >= 0 ? mid - h : mid;
    return `<rect x="${10 + i * step + (step - bw) / 2}" y="${y}" width="${bw}" height="${h}" fill="${x.pnl_pct >= 0 ? 'var(--up)' : 'var(--down)'}" opacity=".85"><title>${x.entry_date}: ${pct(x.pnl_pct)}</title></rect>`;
  }).join('');
  let c = 0; const cum = t.map(x => (c += x.pnl_pct)), lo = Math.min(0, ...cum), hi = Math.max(0, ...cum);
  const pts = cum.map((v, i) => `${10 + i * step + step / 2},${H - 8 - (v - lo) / ((hi - lo) || 1) * (H - 16)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="chart"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line2)"/>${bars}
    <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function detail(s) {
  if (!s) return '<div class="empty">No stock selected</div>';
  const t = curTrades(), ts = t ? tradeStats(t) : null;
  const sig = s.signal ? `<span class="tag ${s.signal.signal.toLowerCase()}">${s.signal.signal}</span>` : '<span class="dim">NONE</span>';
  return `
  <div class="dhead">
    <div><div class="dsym"><a href="https://www.tradingview.com/chart/?symbol=PSE%3A${s.symbol}" target="_blank">${s.symbol} <small>&#8599;</small></a>
      ${s.in_watchlist ? '<span class="star">WATCHLIST</span>' : ''}</div><div class="dname">${s.name || ''}</div></div>
    <div class="dpx"><div class="px">${s.close.toFixed(2)} <small>PHP</small></div>
      <div class="${cls(s.daily_change)}">${pct(s.daily_change)} <span class="dim">1D</span> &nbsp; <span class="${cls(s.weekly_change)}">${pct(s.weekly_change)}</span> <span class="dim">7D</span></div></div>
  </div>
  <div class="cells">
    <div><label>RSI(14)</label><b style="color:${rsiColor(s.rsi)}">${s.rsi ?? '-'}</b></div>
    <div><label>MACD</label><b class="${s.macd_bullish ? 'pos' : 'neg'}">${s.macd_bullish ? 'BULL' : 'BEAR'}</b></div>
    <div><label>EMA 9/21</label><b class="${s.ema_aligned ? 'pos' : 'neg'}">${s.ema_aligned ? '9&gt;21' : '9&lt;21'}</b></div>
    <div><label>SIGNAL</label><b>${sig}</b></div>
    <div><label>BT TRADES</label><b>${s.bt_trades}</b></div>
    <div><label>WIN RATE</label><b class="${s.bt_win_rate >= 50 ? 'pos' : 'neg'}">${s.bt_win_rate.toFixed(1)}%</b></div>
    <div><label>2Y RETURN</label><b class="${cls(s.bt_total_return)}">${pct(s.bt_total_return)}</b></div>
  </div>
  <div class="blk"><div class="blk-t">RSI POSITION</div>${gauge(s.rsi)}</div>
  <div class="blk"><div class="blk-t">BACKTEST TRADES ${ts ? `<span class="dim"> ${ts.n} trades &middot; avg ${pct(ts.avg)} &middot; hold ${ts.hold.toFixed(0)}d &middot; <span style="color:var(--gold)">gold = cumulative</span></span>` : ''}</div>
    ${!t ? '<div class="empty">Loading trades...</div>' : !t.length ? '<div class="empty">No trades in the backtest window</div>' : `
      ${pnlChart(t)}
      <table><thead><tr><th>#</th><th>ENTRY</th><th>PX</th><th>EXIT</th><th>PX</th><th>P&amp;L</th><th>DAYS</th><th>WHY</th></tr></thead><tbody>
      ${t.map((x, i) => `<tr><td class="dim">${i + 1}</td><td>${x.entry_date}</td><td>${x.entry_price.toFixed(2)}</td><td>${x.exit_date}</td><td>${x.exit_price.toFixed(2)}</td>
        <td class="${cls(x.pnl_pct)}">${pct(x.pnl_pct)}</td><td>${x.hold_days}</td><td class="dim">${REASON[x.reason] || x.reason}</td></tr>`).join('')}</tbody></table>`}
  </div>`;
}

function render() {
  const D = S.data; if (!D) return;
  const keep = document.querySelector('.rail-list')?.scrollTop || 0;
  const r = rows(), ov = D.market_overview, os = ov.oversold || [], ob = ov.overbought || [];
  const by = sym => D.stocks.find(x => x.symbol === sym);
  $app.innerHTML = `
  <header class="top">
    <div class="brand"><b>PSE</b>/SIGNALS ${D.dynamic_ranking ? '<span class="dyn">DYN</span>' : ''}</div>
    <div class="mid"><span class="dim">DATA</span> ${D.market_date} <span class="dim">&nbsp;UPD</span> ${D.updated_at.slice(5, 16)}
      <span class="dim">&nbsp;UP</span> <span class="pos">${ov.up}</span> <span class="dim">DN</span> <span class="neg">${ov.down}</span></div>
    <div class="ctl">
      <span class="tf"><button class="${S.tf === '1d' ? 'on' : ''}" onclick="setTF('1d')">1D</button><button class="${S.tf === '4h' ? 'on' : ''}" onclick="setTF('4h')">4H</button></span>
      <button onclick="fetchData()">REFRESH</button><button onclick="fetchNew()" ${S.busy ? 'disabled' : ''}>${S.busy ? 'FETCHING...' : 'FETCH CANDLES'}</button>
    </div>
  </header>
  <main class="term">
    <aside class="rail">
      <div class="rail-tabs"><button class="${!S.all ? 'on' : ''}" onclick="setAll(false)">WATCHLIST ${D.watchlist.length}</button><button class="${S.all ? 'on' : ''}" onclick="setAll(true)">ALL ${D.stocks.length}</button></div>
      <div class="rail-h"><span onclick="setSort('symbol')">SYMBOL${arrow('symbol')}</span><span onclick="setSort('price')">PRICE${arrow('price')}</span><span onclick="setSort('chg')">1D${arrow('chg')}</span><span onclick="setSort('rsi')">RSI${arrow('rsi')}</span></div>
      <div class="rail-list">${r.length ? r.map(s => `<div class="rr ${s.symbol === S.sel ? 'sel' : ''}" data-sym="${s.symbol}" onclick="select(this.dataset.sym)">
        <span class="s">${s.signal ? `<i class="sd ${s.signal.signal.toLowerCase()}"></i>` : ''}${s.symbol}</span><span>${s.close.toFixed(2)}</span>
        <span class="${cls(s.daily_change)}">${pct(s.daily_change)}</span><span style="color:${rsiColor(s.rsi)}">${s.rsi ?? '-'}</span></div>`).join('') : '<div class="empty">Nothing on the watchlist</div>'}</div>
    </aside>
    <section class="center">${detail(cur())}</section>
    <aside class="feed">
      <div class="feed-t">SIGNAL TAPE</div>
      ${D.all_signals.length ? D.all_signals.map(s => `<div class="fr" data-sym="${s.symbol}" onclick="select(this.dataset.sym)">
        <span class="tag ${s.signal.toLowerCase()}">${s.signal}</span><b>${s.symbol}</b><span class="mono">${s.close.toFixed(2)}</span>
        <div class="why">${s.reason} &middot; RSI ${s.rsi}</div></div>`).join('') : `<div class="empty">No signals as of ${D.market_date}</div>`}
      <div class="feed-t">RSI WATCH</div>
      ${os.map(y => `<div class="fr" data-sym="${y}" onclick="select(this.dataset.sym)"><span class="tag sold">OVERSOLD</span><b>${y}</b><span class="mono">${by(y)?.rsi ?? '-'}</span></div>`).join('')}
      ${ob.map(y => `<div class="fr" data-sym="${y}" onclick="select(this.dataset.sym)"><span class="tag sell">OVERBOUGHT</span><b>${y}</b><span class="mono">${by(y)?.rsi ?? '-'}</span></div>`).join('')}
      ${!os.length && !ob.length ? '<div class="empty">Nothing at the extremes</div>' : ''}
    </aside>
  </main>
  <footer class="status">MACD(12,26,9) EMA(9,21) RSI(14) &middot; SL ${D.strategy.sl}% TP ${D.strategy.tp}% &middot; filter &ge;${D.filter_criteria.min_trades} trades, &ge;${D.filter_criteria.min_win_rate}% win, &gt;${D.filter_criteria.min_total_return}% return</footer>`;
  const l = document.querySelector('.rail-list'); if (l) l.scrollTop = keep;
}

</script></body></html>
